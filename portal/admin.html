<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einstellungen – @TITLE@</title>
<style>
  :root {
    --bg: #eef0f3;
    --card: #ffffff;
    --ink: #14171a;
    --muted: #5c6570;
    --line: #d9dee4;
    --field: #ffffff;
    --accent: #1f6feb;
    --accent-ink: #ffffff;
    --warn-bg: #fff5e0;
    --warn-line: #f0d191;
    --warn-ink: #6b4e00;
    --bad-bg: #fdecea;
    --bad-line: #f0b3ac;
    --bad-ink: #8a1c10;
    --ok-bg: #e8f6ee;
    --ok-line: #a8d9bd;
    --ok-ink: #14663d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101316;
      --card: #1b1f24;
      --ink: #eef1f4;
      --muted: #9aa4af;
      --line: #2c3339;
      --field: #12161a;
      --accent: #4c8dff;
      --accent-ink: #0d1117;
      --warn-bg: #33290f;
      --warn-line: #5c4a1c;
      --warn-ink: #f2d79a;
      --bad-bg: #3a1714;
      --bad-line: #6b2b23;
      --bad-ink: #f5b7ae;
      --ok-bg: #123024;
      --ok-line: #1f5c40;
      --ok-ink: #8fe0b4;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px calc(48px + env(safe-area-inset-bottom));
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { padding: 26px 0 16px; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px;
    margin: 0 0 14px;
  }
  h2 {
    margin: 0 0 14px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
  }
  .field { display: block; margin: 0 0 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > span.label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 15px; }
  .field > span.help { display: block; color: var(--muted); font-size: 13px; margin-top: 5px; }
  input[type="text"], input[type="password"], input[type="number"], select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--field);
    color: var(--ink);
    font: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 16px center, right 11px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 34px;
  }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .note {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 14px;
    font-size: 14px;
  }
  .note.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  .note.bad  { background: var(--bad-bg);  border-color: var(--bad-line);  color: var(--bad-ink); }
  .note.ok   { background: var(--ok-bg);   border-color: var(--ok-line);   color: var(--ok-ink); }
  .note ul { margin: 6px 0 0; padding-left: 20px; }
  .actions {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to bottom, transparent, var(--bg) 35%);
    padding: 14px 0 8px;
  }
  button.save {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.save[disabled] { opacity: 0.6; cursor: default; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 6px 0 0; }
  footer a { color: var(--accent); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.95em; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Einstellungen</h1>
    <p class="sub">@SUBTITLE@</p>
  </header>

  @STATUS@

  <form method="post" action="/admin" id="form">
    @GROUPS@
    <div class="actions">
      <button class="save" type="submit" id="save">Speichern und übernehmen</button>
    </div>
  </form>

  <footer>
    <a href="/">Zur Begrüßungsseite</a> · Zustand am Pi: <code>rasphotspot-status</code>
  </footer>
</div>

<script>
(function () {
  var form = document.getElementById('form');
  var save = document.getElementById('save');
  if (!form || !save) return;

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    save.disabled = true;
    save.textContent = 'Wird übernommen …';

    fetch('/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(new FormData(form)).toString()
    }).then(function (response) {
      return response.json();
    }).then(function (data) {
      if (!data.ok) {
        showResult(data);
        return;
      }
      poll(0);
    }).catch(function () {
      // Netzwerk weg heißt hier meist: das WLAN wird gerade neu gestartet.
      save.textContent = 'WLAN startet neu – bitte neu verbinden';
    });
  });

  function poll(tries) {
    if (tries > 40) {
      save.disabled = false;
      save.textContent = 'Speichern und übernehmen';
      return;
    }
    setTimeout(function () {
      fetch('/admin/status?t=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.pending) { poll(tries + 1); return; }
          showResult(data);
        })
        .catch(function () { poll(tries + 1); });
    }, 1000);
  }

  function showResult(data) {
    save.disabled = false;
    save.textContent = 'Speichern und übernehmen';
    var box = document.createElement('div');
    box.className = 'note ' + (data.ok ? 'ok' : 'bad');
    var lines = (data.errors && data.errors.length) ? data.errors : (data.messages || []);
    box.innerHTML = '<strong>' + (data.ok ? 'Übernommen.' : 'Nicht übernommen.') + '</strong>' +
      '<ul>' + lines.map(function (l) {
        return '<li>' + l.replace(/[<>&]/g, function (c) {
          return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c];
        }) + '</li>';
      }).join('') + '</ul>';
    var old = document.querySelector('.note.result');
    if (old) old.remove();
    box.classList.add('result');
    form.parentNode.insertBefore(box, form);
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
})();
</script>
</body>
</html>
